server.port=${PORT:8080}
ridemove.supabase-url=${SUPABASE_URL}
ridemove.supabase-key=${SUPABASE_ANON_KEY}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=false
ridemove.cors-origins=${CORS_ORIGINS:}
ridemove.jwt-issuer=${JWT_ISSUER:${ridemove.supabase-url}/auth/v1}
ridemove.jwt-jwks=${JWT_JWKS_URL:${ridemove.jwt-issuer}/.well-known/jwks.json}
ridemove.jwt-audience=${JWT_AUDIENCE:authenticated}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
