server.port=${PORT:8080}
ridemove.supabase-url=${SUPABASE_URL}
ridemove.supabase-key=${SUPABASE_ANON_KEY}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=false
ridemove.cors-origins=${CORS_ORIGINS:}
ridemove.jwt-issuer=${JWT_ISSUER:${ridemove.supabase-url}/auth/v1}
ridemove.jwt-jwks=${JWT_JWKS_URL:${ridemove.jwt-issuer}/.well-known/jwks.json}
ridemove.jwt-audience=${JWT_AUDIENCE:authenticated}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
ridemove.supabase-service-key=${SUPABASE_SERVICE_KEY:}
ridemove.fare-cop=${RIDE_FARE_COP:8000}
ridemove.wompi.public-key=${WOMPI_PUBLIC_KEY:}
ridemove.wompi.private-key=${WOMPI_PRIVATE_KEY:}
ridemove.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
ridemove.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
ridemove.wompi.api-url=${WOMPI_API_URL:https://production.wompi.co/v1}
ridemove.wompi.checkout-url=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
ridemove.wompi.redirect-url=${WOMPI_REDIRECT_URL:http://127.0.0.1:4200/pago/resultado}
