<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640"><title>Pago demo</title><rect x="0" y="0" width="720" height="640" rx="0" fill="#F5F7FB" stroke="none"/><rect x="0" y="0" width="720" height="640" rx="0" fill="#E8EDF6" stroke="none"/><rect x="130" y="70" width="460" height="500" rx="20" fill="white" stroke="none"/><text x="537" y="112" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#738098">×</text><rect x="163" y="108" width="58" height="58" rx="18" fill="#EDF2FF" stroke="none"/><text x="180" y="150" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#1957ED">↗</text><text x="163" y="207" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1957ED">PAGO · DEMOSTRACIÓN</text><text x="163" y="252" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17243B">Tu viaje, a un paso.</text><text x="163" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#738098">Universidad de Cundinamarca → Plaza Mayor</text><rect x="163" y="327" width="394" height="121" rx="12" fill="#F5F7FB" stroke="none"/><text x="180" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17243B">Este botón es una demostración.</text><text x="180" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#738098">La tarifa y la pasarela aún no están conectadas.</text><text x="180" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#738098">No se piden tarjetas ni se cobra dinero.</text><rect x="163" y="478" width="394" height="49" rx="12" fill="#1957ED" stroke="none"/><text x="181" y="508" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white">Probar confirmación</text><text x="525" y="509" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="white">↗</text></svg>